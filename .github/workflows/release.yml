name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  validate-version:
    name: Validate tag and package version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.validate.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate SemVer tag and project metadata
        id: validate
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          python -m scripts.release_validation tag --tag "${TAG_NAME}" --root .
          echo "version=${TAG_NAME#v}" >> "${GITHUB_OUTPUT}"

  quality:
    name: Release quality checks (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: validate-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check poliglota tests scripts/release_validation.py

      - name: Ruff format check
        run: python -m ruff format --check poliglota tests scripts/release_validation.py

      - name: Version consistency check
        run: python -m pytest tests/test_version_consistency.py -q

      - name: Smoke test suite (CPU only)
        run: python -m pytest -q -m "not gpu" --ignore=tests/test_version_consistency.py

  build:
    name: Build Python distribution artifacts
    needs: [validate-version, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: |
          rm -rf dist
          python -m build --sdist --wheel --outdir dist

      - name: Validate wheel and sdist metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          set -euo pipefail
          python -m twine check dist/*
          python -m scripts.release_validation dist --dist-dir dist --version "${RELEASE_VERSION}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Draft GitHub Release from tag
    needs: [validate-version, quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout commit referenced by release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Verify build artifacts before release
        shell: python
        run: |
          from pathlib import Path
          from scripts.release_validation import validate_distribution_artifacts

          expected = "${{ needs.validate-version.outputs.version }}"
          wheel, sdist = validate_distribution_artifacts(Path("dist"), expected)
          print(f"Validated release artifacts: {wheel.name}, {sdist.name}")

      - name: Check existing GitHub release state
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          release_state="$(python -m scripts.release_validation release-status \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${TAG_NAME}" \
            --token "${GH_TOKEN}" 2>&1)"

          if [[ "${release_state}" != "missing" && "${release_state}" != "draft" && "${release_state}" != "published" ]]; then
            echo "❌ Unexpected GitHub release state for ${TAG_NAME}: ${release_state}" >&2
            exit 1
          fi
          echo "state=${release_state}" >> "${GITHUB_OUTPUT}"
          echo "Release state for ${TAG_NAME}: ${release_state}"

      - name: Create draft GitHub release
        if: needs.validate-version.result == 'success' && needs.quality.result == 'success' && needs.build.result == 'success' && steps.existing.outputs.state == 'missing'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          GITHUB_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          
          echo "🚀 Creating draft release for ${TAG_NAME}..."
          
          # Create release with error handling
          release_output=$(gh release create "${TAG_NAME}" \
            --repo "${GITHUB_REPO}" \
            --draft \
            --generate-notes \
            --title "${TAG_NAME#v}" \
            dist/*.whl \
            dist/*.tar.gz 2>&1) || {
            echo "❌ FAILED to create release!" >&2
            echo "Output: ${release_output}" >&2
            exit 1
          }
          
          echo "✓ Draft release created successfully!"
          python -m scripts.release_validation verify-release \
            --repo "${GITHUB_REPO}" --tag "${TAG_NAME}" --token "${GH_TOKEN}" \
            --version "${TAG_NAME#v}" --asset-count 2

      - name: Verify existing release remains complete
        if: steps.existing.outputs.state == 'draft' || steps.existing.outputs.state == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          GITHUB_REPO: ${{ github.repository }}
          RELEASE_STATE: ${{ steps.existing.outputs.state }}
        run: >-
          python -m scripts.release_validation verify-release
          --repo "${GITHUB_REPO}" --tag "${TAG_NAME}" --token "${GH_TOKEN}"
          --version "${TAG_NAME#v}" --asset-count 2 --expected-state "${RELEASE_STATE}"
