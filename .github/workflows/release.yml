name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  validate-version:
    name: Validate tag and package version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.validate.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate SemVer tag and project metadata
        id: validate
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path

          root = Path('.')
          tag_name = os.environ['TAG_NAME']
          semver_pattern = re.compile(
              r'^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)'
              r'(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)'
              r'(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?'
              r'(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$'
          )

          if not semver_pattern.fullmatch(tag_name):
              raise SystemExit(f"Tag '{tag_name}' is not a valid SemVer 2.0.0 tag. Expected format: vMAJOR.MINOR.PATCH")

          version = tag_name[1:]
          pyproject = tomllib.loads((root / 'pyproject.toml').read_text(encoding='utf-8'))
          pyproject_version = str(pyproject['project']['version'])
          version_file = (root / 'VERSION').read_text(encoding='utf-8').strip()
          init_text = (root / 'poliglota' / '__init__.py').read_text(encoding='utf-8')
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', init_text, re.MULTILINE)
          if match is None:
              raise SystemExit("Unable to parse __version__ from poliglota/__init__.py")
          init_version = match.group(1)

          expected = {pyproject_version, version_file, init_version}
          if len(expected) != 1:
              raise SystemExit(
                  'Version mismatch detected: '
                  f'pyproject={pyproject_version}, VERSION={version_file}, __version__={init_version}'
              )

          if pyproject_version != version:
              raise SystemExit(
                  'Tag version does not match project metadata: '
                  f'tag={version}, pyproject={pyproject_version}'
              )

          print(f"Validated release version {version}")
          PY

          echo "version=${TAG_NAME#v}" >> "${GITHUB_OUTPUT}"

  quality:
    name: Release quality checks (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: validate-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check poliglota tests

      - name: Ruff format check
        run: python -m ruff format --check poliglota tests

      - name: Version consistency check
        run: python -m pytest tests/test_version_consistency.py -q

      - name: Smoke test suite (CPU only)
        run: python -m pytest -q -m "not gpu" --ignore=tests/test_version_consistency.py

  build:
    name: Build Python distribution artifacts
    needs: [validate-version, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel --outdir dist

      - name: Validate wheel and sdist metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m twine check dist/*
          python - <<'PY'
          import os
          import re
          import tarfile
          import zipfile
          from pathlib import Path

          version = os.environ['RELEASE_VERSION']
          dist = Path('dist')
          wheels = sorted(dist.glob('*.whl'))
          sdists = sorted(dist.glob('*.tar.gz'))

          if len(wheels) != 1:
              raise SystemExit(f'Expected exactly one wheel in dist/, found: {wheels}')
          if len(sdists) != 1:
              raise SystemExit(f'Expected exactly one source distribution in dist/, found: {sdists}')

          wheel = wheels[0]
          sdist = sdists[0]

          with zipfile.ZipFile(wheel) as zf:
              metadata_name = next((name for name in zf.namelist() if name.endswith('.dist-info/METADATA')), None)
              if metadata_name is None:
                  raise SystemExit(f'No METADATA file found inside {wheel.name}')

              metadata = zf.read(metadata_name).decode('utf-8')
              name_match = re.search(r'^Name: (.+)$', metadata, re.MULTILINE)
              version_match = re.search(r'^Version: (.+)$', metadata, re.MULTILINE)
              if name_match is None or version_match is None:
                  raise SystemExit(f'Wheel metadata for {wheel.name} is malformed')
              if name_match.group(1).strip() != 'poliglota':
                  raise SystemExit(f'Wheel package name mismatch: {name_match.group(1)!r}')
              if version_match.group(1).strip() != version:
                  raise SystemExit(f'Wheel package version mismatch: expected {version}, found {version_match.group(1)!r}')

          with tarfile.open(sdist, mode='r:gz') as tf:
              pkginfo = next((member for member in tf.getmembers() if member.name.endswith('PKG-INFO')), None)
              if pkginfo is None:
                  raise SystemExit(f'No PKG-INFO file found inside {sdist.name}')
              metadata = tf.extractfile(pkginfo).read().decode('utf-8')
              name_match = re.search(r'^Name: (.+)$', metadata, re.MULTILINE)
              version_match = re.search(r'^Version: (.+)$', metadata, re.MULTILINE)
              if name_match is None or version_match is None:
                  raise SystemExit(f'SDIST metadata for {sdist.name} is malformed')
              if name_match.group(1).strip() != 'poliglota':
                  raise SystemExit(f'SDIST package name mismatch: {name_match.group(1)!r}')
              if version_match.group(1).strip() != version:
                  raise SystemExit(f'SDIST package version mismatch: expected {version}, found {version_match.group(1)!r}')

          print(f'Validated wheel and sdist for {version}: {wheel.name}, {sdist.name}')
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Draft GitHub Release from tag
    needs: [validate-version, quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Create draft release when absent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          release_state_file="$(mktemp)"
          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft,name,tagName > "${release_state_file}" 2>"${release_state_file}.err"; then
            echo "A release already exists for ${TAG_NAME}. No new draft will be created."
            exit 0
          fi

          if grep -qi "Not Found\|404" "${release_state_file}.err"; then
            echo "No existing GitHub release found for ${TAG_NAME}. Creating draft release..."
          else
            echo "Unable to determine whether a release already exists for ${TAG_NAME}." >&2
            cat "${release_state_file}.err" >&2
            exit 1
          fi

          ls -l dist

          gh release create "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --generate-notes \
            --title "${TAG_NAME#v}" \
            dist/*.whl \
            dist/*.tar.gz
