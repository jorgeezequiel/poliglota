name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint, formatação e versão
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/requirements-ci-unit.txt

      - name: Instalar dependências de desenvolvimento
        run: python -m pip install -r .github/requirements-ci-unit.txt

      - name: Validar partição de testes
        run: python scripts/ci_reporting.py validate-selection

      - name: Ruff (lint)
        run: python -m ruff check poliglota tests scripts/release_validation.py scripts/ci_reporting.py

      - name: Ruff (formatação)
        run: python -m ruff format --check poliglota tests scripts/release_validation.py scripts/ci_reporting.py

      - name: Consistência de versão
        run: python -m pytest tests/test_version_consistency.py -v

  unit-tests:
    name: Testes Unitários (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/requirements-ci-unit.txt

      - name: Instalar dependências de desenvolvimento
        run: python -m pip install -r .github/requirements-ci-unit.txt

      - name: Validar pacote instalado
        shell: python
        run: |
          import importlib.metadata as md
          from pathlib import Path

          import poliglota

          expected = Path("VERSION").read_text(encoding="utf-8").strip()
          installed = md.version("poliglota")
          assert poliglota.__version__ == installed == expected, (
              poliglota.__version__,
              installed,
              expected,
          )
          print(f"poliglota {installed} (VERSION {expected})")

      - name: Criar diretório de relatórios
        run: python -c "from pathlib import Path; Path('reports/test-results').mkdir(parents=True, exist_ok=True)"

      - name: Executar testes unitários (sem GPU/CUDA)
        run: >
          python -m pytest -q -m unit
          --junitxml=reports/test-results/junit-unit-${{ matrix.os }}-py${{ matrix.python-version }}.xml
          --tb=short

      - name: Publicar resultados JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-unit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/test-results/junit-unit-*.xml
          if-no-files-found: warn
          retention-days: 7

  integration-cpu:
    name: Testes Integração CPU (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/requirements-ci-unit.txt
            .github/requirements-ci-cpu.txt

      - name: Instalar PyTorch CPU (Windows/Linux)
        if: runner.os != 'macOS'
        run: >
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          "torch>=2.7.0,<3"

      - name: Instalar PyTorch (macOS, CPU/MPS runtime)
        if: runner.os == 'macOS'
        run: python -m pip install "torch>=2.7.0,<3"

      - name: Instalar dependências de integração CPU
        run: |
          python -m pip install -r .github/requirements-ci-unit.txt
          python -m pip install -r .github/requirements-ci-cpu.txt

      - name: Validar PyTorch/Transformers instalados
        shell: python
        run: |
          import torch
          import transformers
          print(f"PyTorch {torch.__version__}")
          print(f"Transformers {transformers.__version__}")
          print(f"CUDA runtime embutido: {torch.version.cuda}")
          assert torch.version.cuda is None, "CPU job installed a CUDA-enabled PyTorch wheel"

      - name: Criar diretório de relatórios
        run: python -c "from pathlib import Path; Path('reports/test-results').mkdir(parents=True, exist_ok=True)"

      - name: Executar testes integração (CPU, sem GPU)
        env:
          HF_HUB_OFFLINE: "1"
        run: >
          python -m pytest -q -m "not gpu and not unit" --ignore=tests/test_version_consistency.py
          --junitxml=reports/test-results/junit-integration-cpu-${{ matrix.os }}-py${{ matrix.python-version }}.xml
          --tb=short 2>&1

      - name: Publicar resultados JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-integration-cpu-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/test-results/junit-integration-cpu-*.xml
          if-no-files-found: warn
          retention-days: 7

  integration-gpu:
    name: Testes Integração GPU (CUDA)
    runs-on: [self-hosted, gpu, cuda]
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar dependências de desenvolvimento + GPU stack
        run: python -m pip install -e ".[dev,gpu]"

      - name: Validar CUDA disponível
        shell: python
        run: |
          import torch
          assert torch.cuda.is_available(), "CUDA not available on GPU runner"
          print(f"CUDA Device: {torch.cuda.get_device_name(0)}")
          print(f"CUDA Capability: {torch.cuda.get_device_capability(0)}")

      - name: Criar diretório de relatórios
        run: python -c "from pathlib import Path; Path('reports/test-results').mkdir(parents=True, exist_ok=True)"

      - name: Executar smoke test real de CUDA
        env:
          HF_HUB_OFFLINE: "1"
          POLIGLOTA_DEVICE: "cuda"
        run: >
          python -m pytest -q -m gpu
          --junitxml=reports/test-results/junit-integration-gpu-cuda-py3.13.xml
          --tb=short 2>&1

      - name: Publicar resultados JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-integration-gpu-cuda-py3.13
          path: reports/test-results/junit-integration-gpu-*.xml
          if-no-files-found: warn
          retention-days: 7

  summary:
    name: Resumo dos Resultados
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, unit-tests, integration-cpu, integration-gpu]

    steps:
      - name: Checkout para relatórios
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar parser seguro de JUnit
        run: python -m pip install defusedxml

      - name: Download artefatos JUnit
        uses: actions/download-artifact@v4
        if: always()
        with:
          path: reports/test-results

      - name: Compilar resumo
        if: always()
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: >
          python scripts/ci_reporting.py summarize
          --results-dir reports/test-results
          --event-name "$CI_EVENT_NAME"
          --needs-json "$CI_NEEDS"
