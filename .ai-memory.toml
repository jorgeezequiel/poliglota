workspace = "poliglota"
project = "poliglota"
project_strategy = "repo-root"

[capture]
ignore_paths = [
  "**/.git/**",
  "**/.venv/**",
  "**/venv*/**",
  "**/__pycache__/**",
  "**/.pytest_cache/**",
  "**/.ruff_cache/**",
  "**/dist/**",
  "**/build/**",
  "**/node_modules/**",
  "**/.mypy_cache/**",
  "**/.cache/**"
]
